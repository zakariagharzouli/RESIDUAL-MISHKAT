<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mishkat (مِشْكَاة)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Amiri+Quran&family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f8f3e9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c0a08" media="(prefers-color-scheme: dark)">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Filet de sécurité : si l'app ne démarre pas en 10 s (cache abîmé, ancienne
      // version bloquée), on vide le cache et on recharge une seule fois.
      setTimeout(function () {
        if (window.__mishkatBooted) return;
        try { if (sessionStorage.getItem('mishkat_recovered')) return; sessionStorage.setItem('mishkat_recovered', '1'); } catch (e) {}
        var regs = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : Promise.resolve();
        var cs = window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : Promise.resolve();
        Promise.all([regs, cs]).then(function () { location.reload(); }, function () { location.reload(); });
      }, 10000);
    </script>
  </body>
</html>
